# ============================================================================
# .github/workflows/clean-text.yml
# Fails when any tracked file holds a non-ASCII character
# ============================================================================
name: Clean Text

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: clean-text-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-text:
    name: Clean Text
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail on non-ASCII characters in tracked files
        shell: bash
        run: |
          # git grep exits 0 on a match and 1 on none, so test it in an if
          if git grep -nP '[^\x00-\x7F]'; then
            echo "ERROR: non-ASCII characters found in the files listed above"
            exit 1
          fi
          echo "No non-ASCII characters in tracked files"
